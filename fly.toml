# Ejemplo de configuración para desplegar el backend en Fly.io (opcional).
# Ajustá "app" a un nombre único. Requiere el volumen "primeranota_data"
# para que la biblioteca (data/) sobreviva a los redeploys:
#   fly volumes create primeranota_data --size 1
app = "primeranota-backend"
primary_region = "gru"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[[mounts]]
  source = "primeranota_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
